cd ..
@"
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: warehouse_postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=warehouse_db
      - POSTGRES_USER=warehouse_user
      - POSTGRES_PASSWORD=warehouse_password
    ports:
      - "5432:5432"
    networks:
      - warehouse_network

  backend:
    build: ./backend
    container_name: warehouse_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DB_NAME=warehouse_db
      - DB_USER=warehouse_user
      - DB_PASSWORD=warehouse_password
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      - postgres
    networks:
      - warehouse_network

  frontend:
    build: ./frontend
    container_name: warehouse_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - warehouse_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  warehouse_network:
    driver: bridge
"@ | Out-File -FilePath docker-compose.yml -Encoding UTF8