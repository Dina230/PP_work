version: '3.8'

services:
  # Backend Django с SQLite
  backend:
    build: ./backend
    container_name: warehouse_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - sqlite_data:/app  # Сохраняем SQLite базу данных
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DB_ENGINE=sqlite3
      - SECRET_KEY=django-insecure-docker-key-please-change
    networks:
      - warehouse_network
    command: >
      sh -c "
        python manage.py migrate &&
        echo 'from apps.accounts.models import User; User.objects.filter(username=\"admin\").exists() or User.objects.create_superuser(\"admin\", \"admin@example.com\", \"admin123\")' | python manage.py shell &&
        python manage.py runserver 0.0.0.0:8000
      "

  # Frontend React
  frontend:
    build: ./frontend
    container_name: warehouse_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - warehouse_network

volumes:
  sqlite_data:  # Для сохранения базы данных SQLite
  static_volume:
  media_volume:

networks:
  warehouse_network:
    driver: bridge