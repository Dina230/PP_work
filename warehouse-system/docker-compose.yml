version: '3.8'

services:
  # База данных PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: warehouse_postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-warehouse_db}
      - POSTGRES_USER=${POSTGRES_USER:-warehouse_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-warehouse_password}
    ports:
      - "5432:5432"
    networks:
      - warehouse_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_user -d warehouse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis для кэширования и сессий
  redis:
    image: redis:7-alpine
    container_name: warehouse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - warehouse_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend на Django
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: warehouse_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-your-secret-key-here}
      - DB_NAME=${POSTGRES_DB:-warehouse_db}
      - DB_USER=${POSTGRES_USER:-warehouse_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-warehouse_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - warehouse_network
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py loaddata fixtures/initial_data.json --ignore &&
        python manage.py runserver 0.0.0.0:8000
      "

  # Frontend на React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: warehouse_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      - PORT=3000
    depends_on:
      - backend
    networks:
      - warehouse_network
    command: npm start

  # Nginx для проксирования (опционально)
  nginx:
    image: nginx:1.25-alpine
    container_name: warehouse_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/static
      - media_volume:/media
    depends_on:
      - backend
      - frontend
    networks:
      - warehouse_network

# Тома для хранения данных
volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

# Сеть для связи между контейнерами
networks:
  warehouse_network:
    driver: bridge